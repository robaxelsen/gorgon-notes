# Gorgon Notes party room: one Durable Object (SQLite) per party code. docs/SHARING.md option 2.
# Deploy: npx wrangler deploy (after npx wrangler login). Local: npx wrangler dev --port 8790
name = "gorgon-notes-room"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
