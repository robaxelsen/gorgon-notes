# Gorgon Notes party room: one Durable Object (SQLite) per party code. docs/SHARING.md option 2.
# Deploy: npx wrangler deploy (after npx wrangler login). Local: npx wrangler dev --port 8790
name = "gorgon-notes-room"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = true

# Discord "Connect a channel" (docs/DISCORD.md): the application's client id is public; the secret is set once with
# `npx wrangler secret put DISCORD_CLIENT_SECRET`, never written here. Register the redirect
# https://<this worker>/discord/callback on the application's OAuth2 page in the Discord Developer Portal.
[vars]
DISCORD_CLIENT_ID = "1564249189985034401"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "BROKER"
class_name = "Broker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Broker"]
